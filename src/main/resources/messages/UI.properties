# config UI messages
ui.config.text-font.title=Text Font/Size
ui.config.text-font.hint=Configure the font and size for sample typing text and typing area. Fonts with true \
  small caps (Georgia, Palatino Linotype, Garamond, Calibri, Verdana, Copperplate Gothic) are listed first. \
  Size range: 8-24pt (default: 13pt)
ui.config.practice-mode.title=Practice Mode:
ui.config.practice-mode.hint=Select which hand you want to use for touch typing practice. 'Left Hand' focuses on \
  left-hand keys, 'Right Hand' trains right-hand keys, and 'Both Hands' provides a full-keyboard experience.
ui.config.practice-mode.radio.left-hand=Left Hand
ui.config.practice-mode.radio.right-hand=Right Hand
ui.config.practice-mode.radio.both-hands=Both Hands
ui.config.generation-mode.title=Word Generation Mode:
ui.config.generation-mode.hint=Choose how the practice text is generated. 'Random Letters' generates random runs of \
  the enabled keys. 'Exact Words' uses only real English words typed entirely with the enabled keys. \
  'Adapted Words' uses real English words with unavailable letters removed, favoring recognizable fragments.
ui.config.generation-mode.radio.random=Random Letters
ui.config.generation-mode.radio.exact-words=Exact Words
ui.config.generation-mode.radio.adapted-words=Adapted Words
ui.config.key-limit-per-finder.title=Key Limit Per Finger (1-6):
ui.config.key-limit-per-finder.hint=Defines the maximum number of keys each finger can be assigned during practice. \
  A lower value enforces strict finger placement, while a higher value allows more flexibility in key coverage.
ui.config.finger-selection.title=Finger Selection:
ui.config.finger-selection.hint=Choose which fingers to use for touch typing practice. Select specific fingers or \
  enable all fingers for a full-hand experience. This setting helps tailor the practice to your typing style and \
  comfort level.
ui.config.finger-selection.checkbox.use-all-fingers=Use All Fingers
ui.config.finger-selection.checkbox.specific-fingers=Select Specific Fingers
ui.config.finger-selection.error.at-least-one=At least one finger should be selected

# tool window messages
ui.tool-window.reset-link=reset
ui.tool-window.reset-hint=Hit Enter to
ui.tool-window.reset-tooltip=Reset practice text and clear input (press Enter after completing the text)
ui.tool-window.status-errors=Typing errors: {0}
ui.tool-window.status-wpm=Typing speed: {0} WPM
ui.tool-window.status-separator=|
