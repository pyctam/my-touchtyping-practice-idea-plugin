# Qodana configuration:
# https://www.jetbrains.com/help/qodana/qodana-yaml.html

version: 1.0
linter: jetbrains/qodana-jvm-community:2024.2
projectJDK: "17"
profile:
  name: qodana.recommended
exclude:
  - name: All
    paths:
      - .qodana
      # package.kt files hold only a package-level KDoc + `package` declaration. Qodana's
      # headless analysis false-positives "Unresolved reference in KDoc" on the same-package
      # references there (the IDE resolves them fine), so exclude them from analysis.
      - '**/package.kt'
